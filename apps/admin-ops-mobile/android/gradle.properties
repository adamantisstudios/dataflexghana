# 8G/4G overcommitted this machine's RAM and the JVM was killed mid-build with no
# error. These values are the ones that build agent-mobile reliably here.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=true
android.lint.checkReleaseBuilds=false
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
