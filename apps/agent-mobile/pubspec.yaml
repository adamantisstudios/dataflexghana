name: agent_mobile
description: DataFlex Ghana agent Android app — login, data bundles, compliance.
publish_to: "none"
version: 1.0.6+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  # Selfie auto-approval: face box/count from ML Kit, pixel maths from `image`.
  # See android/app/build.gradle.kts — the bundled ML Kit model is swapped for
  # the thin Play Services variant to keep the APK small.
  google_mlkit_face_detection: ^0.13.1
  image: ^4.3.0
  file_picker: ^8.1.4
  http_parser: ^4.0.2
  path_provider: ^2.1.5
  webview_flutter: ^4.14.1
  # Needed directly to disable Android's user-gesture requirement for media,
  # which otherwise blocks tutorial video autoplay.
  webview_flutter_android: ^4.9.0
  livekit_client: ^2.11.0
  permission_handler: 12.0.0
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.jpg"
  adaptive_icon_foreground_inset: 18

flutter:
  uses-material-design: true
  assets:
    - assets/images/
