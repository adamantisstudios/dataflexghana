# Sized to leave headroom on a 16 GB machine — an 8G heap plus 4G metaspace
# overcommits and the daemon gets killed mid-build.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
org.gradle.caching=true
# Serial execution keeps peak memory down; the WebRTC/LiveKit modules are large.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=true
android.lint.checkReleaseBuilds=false
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
